name: Build Remote Linux

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compiler Remote Linux
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name "Remote Linux" main.py

      - name: Sauvegarder l EXE
        uses: actions/upload-artifact@v7
        with:
          name: Remote-Linux-Windows
          path: dist/Remote Linux.exe
          if-no-files-found: error
